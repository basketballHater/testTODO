# Start everything:   docker compose up --build
# App:                http://localhost:8080   (API also on http://localhost:8000/api/tasks)
#
# Optional test runners (not started by `up`):
#   docker compose --profile test run --rm backend-tests
#   docker compose --profile test run --rm frontend-tests
#   docker compose --profile e2e  run --rm e2e

x-db-env: &db-env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_USERNAME: todo
  DB_PASSWORD: ${DB_PASSWORD:-secret}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *db-env
      DB_DATABASE: todo
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      LOG_CHANNEL: stderr
      # Load the demo tasks from the UI mockup on first start (idempotent). Set to false for an empty list.
      DB_SEED: ${DB_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:80"

  frontend:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # ---- test runners (profiles keep them out of `docker compose up`) ----
  backend-tests:
    profiles: ["test"]
    build: ./backend
    environment:
      <<: *db-env
      DB_DATABASE: todo_test
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["php", "artisan"]
    command: ["test"]

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: build
    command: ["npm", "test"]

  e2e:
    profiles: ["e2e"]
    build:
      context: ./frontend
      target: e2e
    environment:
      E2E_BASE_URL: http://frontend
      CI: "true"
    depends_on:
      - frontend
    volumes:
      - ./frontend/playwright-report:/app/playwright-report

volumes:
  db_data:
